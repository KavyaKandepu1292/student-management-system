<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIT Records — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="brand">
      <div>
        <h1>🎓 VIT Records</h1>
        <div class="tagline">Unified Student Administration Framework</div>
      </div>
    </div>
    <div class="nav-links" id="navLinks"></div>
  </div>

  <div id="alertBox"></div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="label">Total Students</div><div class="value" id="statStudents">—</div></div>
    <div class="stat-card"><div class="label">Total Courses</div><div class="value" id="statCourses">—</div></div>
    <div class="stat-card"><div class="label">Average GPA</div><div class="value" id="statGpa">—</div></div>
  </div>

  <div class="charts-grid">
    <div class="card">
      <h3 style="margin-top:0;">Students by Department</h3>
      <canvas id="deptChart" height="220"></canvas>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Attendance Breakdown</h3>
      <canvas id="attChart" height="220"></canvas>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  Auth.requireAdmin();
  renderNav("dashboard");

  const alertBox = document.getElementById("alertBox");

  async function loadDashboard() {
    try {
      const stats = await apiRequest("/dashboard/stats");
      document.getElementById("statStudents").textContent = stats.totalStudents;
      document.getElementById("statCourses").textContent = stats.totalCourses;
      document.getElementById("statGpa").textContent = stats.averageGpa.toFixed(2);

      const deptLabels = Object.keys(stats.studentsByDepartment);
      const deptValues = Object.values(stats.studentsByDepartment);
      new Chart(document.getElementById("deptChart"), {
        type: "bar",
        data: {
          labels: deptLabels.length ? deptLabels : ["No data"],
          datasets: [{
            label: "Students",
            data: deptValues.length ? deptValues : [0],
            backgroundColor: "#ff9466"
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#b8aec2" }, grid: { color: "#3a3350" } },
            y: { ticks: { color: "#b8aec2" }, grid: { color: "#3a3350" }, beginAtZero: true }
          }
        }
      });

      const attLabels = Object.keys(stats.attendanceByStatus);
      const attValues = Object.values(stats.attendanceByStatus);
      new Chart(document.getElementById("attChart"), {
        type: "doughnut",
        data: {
          labels: attLabels.length ? attLabels : ["No data"],
          datasets: [{
            data: attValues.length ? attValues : [1],
            backgroundColor: ["#4caf7d", "#e5484d", "#ff9466", "#7a6a9a"]
          }]
        },
        options: {
          plugins: { legend: { position: "bottom", labels: { color: "#f5f0eb" } } }
        }
      });
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  loadDashboard();
</script>
</body>
</html>
