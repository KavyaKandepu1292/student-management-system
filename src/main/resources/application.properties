spring.application.name=student-management-system

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/vit_records?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1292@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
# Use a long, random, secret string in production (32+ chars). Keep it out of source control.
jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS_LONG
jwt.expiration-ms=86400000

# ---------- Server ----------
server.port=8081

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
