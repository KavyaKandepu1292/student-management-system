<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIT Records — Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card" style="max-width:480px;">
    <h1>Create Account</h1>
    <p class="sub">Register as an Admin or a Student</p>

    <div id="alertBox"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="role">Account Type</label>
        <select id="role" required>
          <option value="STUDENT">Student</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@domain.edu" required>
      </div>

      <div id="studentFields">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="Enter first name">
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Enter last name">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" placeholder="e.g., Information Technology">
          </div>
          <div class="form-group">
            <label for="gpa">Current GPA</label>
            <input type="number" id="gpa" placeholder="0.00 - 4.00" step="0.01" min="0" max="4">
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%" id="registerBtn">Create Account</button>
    </form>

    <p class="switch-link">Already have an account? <a href="index.html">Sign in</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const roleSelect = document.getElementById("role");
  const studentFields = document.getElementById("studentFields");

  function toggleStudentFields() {
    studentFields.style.display = roleSelect.value === "STUDENT" ? "block" : "none";
  }
  roleSelect.addEventListener("change", toggleStudentFields);
  toggleStudentFields();

  const form = document.getElementById("registerForm");
  const alertBox = document.getElementById("alertBox");
  const registerBtn = document.getElementById("registerBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.innerHTML = "";
    registerBtn.disabled = true;
    registerBtn.textContent = "Creating account...";

    const payload = {
      username: document.getElementById("username").value.trim(),
      password: document.getElementById("password").value,
      email: document.getElementById("email").value.trim(),
      role: roleSelect.value
    };

    if (roleSelect.value === "STUDENT") {
      payload.firstName = document.getElementById("firstName").value.trim();
      payload.lastName = document.getElementById("lastName").value.trim();
      payload.department = document.getElementById("department").value.trim();
      payload.gpa = parseFloat(document.getElementById("gpa").value);
    }

    try {
      const data = await apiRequest("/auth/register", { method: "POST", body: payload });
      Auth.setSession(data);
      window.location.href = data.role === "ADMIN" ? "dashboard.html" : "students.html";
    } catch (err) {
      let msg = err.message;
      if (err.fieldErrors) {
        msg += "<br>" + Object.values(err.fieldErrors).join("<br>");
      }
      alertBox.innerHTML = `<div class="alert alert-error">${msg}</div>`;
    } finally {
      registerBtn.disabled = false;
      registerBtn.textContent = "Create Account";
    }
  });
</script>
</body>
</html>
